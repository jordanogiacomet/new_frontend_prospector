apiVersion: v1
kind: Namespace
metadata:
  name: prospecta-demo3
  labels:
    prospecta.openai.local/environment: non-production
    prospecta.openai.local/disposable: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: __CONFIG_NAME__
  namespace: prospecta-demo3
  labels:
    app.kubernetes.io/name: prospecta
    app.kubernetes.io/instance: demo3
    app.kubernetes.io/version: __RELEASE_ID__
data:
  NODE_ENV: production
  AUTH_URL: https://192.168.0.20:30100
  AUTH_DEV_BYPASS_ENABLED: "true"
  AUTH_OIDC_ISSUER: https://identity.example.com/demo3
  AUTH_OIDC_CLIENT_ID: demo3-local-placeholder
  DEMO2_FULL_ACCESS_ENABLED: "false"
  DEMO2_K8S_RUNTIME_ENABLED: "false"
  DEMO3_LOCAL_RUNTIME_ENABLED: "true"
  N8N_IMPORT_URL: http://192.168.0.20:30098/webhook/empresaqui/import
  IMPORT_MAX_BYTES: "10485760"
  IMPORT_PRODUCER_TIMEOUT_MS: "15000"
  FEATURE_IMPORTS_ENABLED: "true"
  FEATURE_BATCH_OBSERVATION_ENABLED: "true"
  FEATURE_COMMERCIAL_ENABLED: "true"
  FEATURE_SENSITIVE_CONTENT_ENABLED: "true"
  FEATURE_DEMO_DATA_ENABLED: "false"
  FEATURE_COSTS_ENABLED: "true"
  COSTS_READ_SUBJECTS: demo3-preproduction-user
---
apiVersion: v1
kind: Service
metadata:
  name: prospecta-demo3-postgres
  namespace: prospecta-demo3
  labels:
    app.kubernetes.io/name: prospecta-demo3-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prospecta-demo3-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prospecta-demo3-postgres
  namespace: prospecta-demo3
  labels:
    app.kubernetes.io/name: prospecta-demo3-postgres
    app.kubernetes.io/version: __RELEASE_ID__
spec:
  serviceName: prospecta-demo3-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prospecta-demo3-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prospecta-demo3-postgres
        app.kubernetes.io/instance: demo3
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: __POSTGRES_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: prospecta_demo3
            - name: POSTGRES_USER
              value: prospecta_demo3_owner
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __POSTGRES_SECRET_NAME__
                  key: DEMO3_POSTGRES_OWNER_PASSWORD
            - name: DEMO3_APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __POSTGRES_SECRET_NAME__
                  key: DEMO3_APP_DATABASE_PASSWORD
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  psql -v ON_ERROR_STOP=1 -U prospecta_demo3_owner
                  -d prospecta_demo3 -Atqc
                  "select has_table_privilege('prospecta_app_rw',
                  'prospecting_app.lead_workspaces', 'SELECT')" |
                  grep -qx t
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U prospecta_demo3_owner -d prospecta_demo3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U prospecta_demo3_owner -d prospecta_demo3
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsGroup: 70
            runAsUser: 70
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: prospecta-demo3-postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prospecta-demo3
  namespace: prospecta-demo3
  labels:
    app.kubernetes.io/name: prospecta
    app.kubernetes.io/instance: demo3
    app.kubernetes.io/version: __RELEASE_ID__
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prospecta
      app.kubernetes.io/instance: demo3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prospecta
        app.kubernetes.io/instance: demo3
        app.kubernetes.io/version: __RELEASE_ID__
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prospecta
          image: __APP_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: __CONFIG_NAME__
            - secretRef:
                name: __APP_SECRET_NAME__
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: request-edge
          image: __EDGE_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: edge
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: edge
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: edge
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: gateway-auth
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: gateway-tls
              mountPath: /etc/nginx/tls
              readOnly: true
        - name: postgres-loopback-proxy
          image: __PROXY_IMAGE__
          imagePullPolicy: Always
          args:
            - TCP-LISTEN:15432,fork,reuseaddr
            - TCP:prospecting-postgres.prospecting.svc.cluster.local:5432
          ports:
            - name: postgres-proxy
              containerPort: 15432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: gateway-auth
          secret:
            secretName: __GATEWAY_SECRET_NAME__
            items:
              - key: htpasswd
                path: htpasswd
        - name: gateway-tls
          secret:
            secretName: __GATEWAY_SECRET_NAME__
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: prospecta-demo3
  namespace: prospecta-demo3
  labels:
    app.kubernetes.io/name: prospecta
    app.kubernetes.io/instance: demo3
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prospecta
    app.kubernetes.io/instance: demo3
  ports:
    - name: https
      port: 443
      targetPort: edge
      nodePort: 30100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prospecta-demo3-app-egress
  namespace: prospecta-demo3
  labels:
    app.kubernetes.io/name: prospecta
    app.kubernetes.io/instance: demo3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prospecta
      app.kubernetes.io/instance: demo3
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prospecta-demo3-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prospecting
          podSelector:
            matchLabels:
              app: prospecting-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 192.168.0.20/32
      ports:
        - protocol: TCP
          port: 30098
