apiVersion: v1
kind: Namespace
metadata:
  name: prospecta-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prospecta-demo-config
  namespace: prospecta-demo
data:
  AUTH_URL: http://192.168.0.20:30097
  NODE_ENV: production
  DEMO2_K8S_RUNTIME_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prospecta-demo
  namespace: prospecta-demo
  labels:
    app: prospecta-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prospecta-demo
  template:
    metadata:
      labels:
        app: prospecta-demo
    spec:
      containers:
        - name: prospecta
          image: localhost:5000/prospecta/app:demo
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: prospecta-demo-config
            - secretRef:
                name: prospecta-demo-secrets
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
        - name: postgres-loopback-proxy
          image: localhost:5000/prospecta/postgres-loopback-proxy:demo
          imagePullPolicy: Always
          args:
            - TCP-LISTEN:15432,fork,reuseaddr
            - TCP:prospecting-postgres.prospecting.svc.cluster.local:5432
          ports:
            - name: postgres-proxy
              containerPort: 15432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prospecta-demo
  namespace: prospecta-demo
  labels:
    app: prospecta-demo
spec:
  type: NodePort
  selector:
    app: prospecta-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30097
