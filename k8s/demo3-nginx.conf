pid /tmp/nginx.pid;
error_log stderr notice;

events {}

http {
  access_log off;
  client_body_temp_path /tmp/client-body;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  scgi_temp_path /tmp/scgi;
  uwsgi_temp_path /tmp/uwsgi;
  client_max_body_size 11m;

  server {
    listen 8080;
    server_tokens off;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Machine-to-machine callback used by the existing n8n workflow. The app
    # validates its dedicated secret before reading the JSON body.
    location = /api/imports/events {
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Prospecta-N8N-Secret $http_x_prospecta_n8n_secret;
      proxy_set_header Authorization "";
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    # Machine callback for the separate contact-enrichment workflow. The app
    # checks its dedicated secret before reading JSON or app-owned storage.
    location = /api/contact-enrichment/callback {
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Prospecta-Contact-Callback-Secret $http_x_prospecta_contact_callback_secret;
      proxy_set_header Authorization "";
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    location / {
      auth_basic "Prospecta Demo 3";
      auth_basic_user_file /etc/nginx/auth/htpasswd;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }
  }

  # Dedicated Demo 3 TLS edge. The legacy HTTP listener remains available only
  # for the already approved non-PII flows; contact v2 always enters here.
  server {
    listen 8443 ssl;
    server_tokens off;
    ssl_certificate /etc/nginx/contact-v2-tls/tls.crt;
    ssl_certificate_key /etc/nginx/contact-v2-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The app calls this exact path server-to-server. n8n performs its native
    # Header Auth check; no browser route is proxied to n8n.
    location = /webhook/prospecta/lusha/contact-enrichment-v2 {
      client_max_body_size 8k;
      proxy_pass http://n8n.n8n.svc.cluster.local:5678;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    location = /api/contact-enrichment/v2/callback {
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Prospecta-Contact-Callback-Secret $http_x_prospecta_contact_callback_secret;
      proxy_set_header Authorization "";
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    location = /api/contact-enrichment/v2/company-search-callback {
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Prospecta-Contact-Callback-Secret $http_x_prospecta_contact_callback_secret;
      proxy_set_header Authorization "";
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    location = /api/contact-enrichment/v2/reveal-callback {
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Prospecta-Contact-Callback-Secret $http_x_prospecta_contact_callback_secret;
      proxy_set_header Authorization "";
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    location / {
      auth_basic "Prospecta Demo 3";
      auth_basic_user_file /etc/nginx/auth/htpasswd;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }
  }
}
